[package]
name = "sbxpress"
version = "0.3.4"
edition = "2021"
description = "Convert raw Roche SBX reads into per-sample 10x R1/R2 FASTQs for Cell Ranger"

[lib]
name = "sbx10x"
path = "src/lib.rs"

[[bin]]
name = "sbx10x"
path = "src/main.rs"

[[bin]]
name = "sbx10x-annotate"
path = "src/bin/sbx10x-annotate.rs"

[[bin]]
name = "sbx10x-molecules"
path = "src/bin/sbx10x-molecules.rs"

[[bin]]
name = "sbxpress"
path = "src/bin/sbxpress.rs"

[[bin]]
name = "sbxpress-illumina"
path = "src/bin/sbxpress-illumina.rs"

[[bin]]
name = "sbxpress-cells"
path = "src/bin/sbxpress-cells.rs"

[dependencies]
needletail = "0.5"
flate2 = { version = "1.0", features = ["zlib"] }
triple_accel = "0.4"
rayon = "1.10"
rustc-hash = "2"
crossbeam-channel = "0.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-htslib = { version = "0.49", default-features = false, features = ["bzip2", "lzma"] }
hdf5 = "0.8.1"
hdf5-sys = { version = "0.8.1", features = ["static", "zlib"] }
rand = "0.8"
rand_chacha = "0.3"
statrs = "0.18"

[dev-dependencies]
tempfile = "3"
