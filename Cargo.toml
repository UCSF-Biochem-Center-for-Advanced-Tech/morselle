[package]
name = "sbxpress"
version = "0.6.3"
edition = "2021"
description = "Convert raw Roche SBX reads into per-sample 10x-style FASTQs and expression matrices"

[lib]
name = "sbx10x"
path = "src/lib.rs"

[[bin]]
name = "sbx10x"
path = "src/main.rs"

[[bin]]
name = "sbx10x-annotate"
path = "src/bin/sbx10x-annotate.rs"

[[bin]]
name = "sbx10x-molecules"
path = "src/bin/sbx10x-molecules.rs"

[[bin]]
name = "sbxpress"
path = "src/bin/sbxpress.rs"

[[bin]]
name = "sbxpress-illumina"
path = "src/bin/sbxpress-illumina.rs"

[[bin]]
name = "sbxpress-cells"
path = "src/bin/sbxpress-cells.rs"

[[bin]]
name = "sbxpress-probe-demux"
path = "src/bin/sbxpress-probe-demux.rs"

[[bin]]
name = "sbxpress-guides"
path = "src/bin/sbxpress-guides.rs"

[[bin]]
name = "sbxpress-protospacer-call"
path = "src/bin/sbxpress-protospacer-call.rs"

[[bin]]
name = "sbxpress-probeset-align"
path = "src/bin/sbxpress-probeset-align.rs"

[dependencies]
needletail = "0.5"
flate2 = { version = "1.0", features = ["zlib"] }
rapidgzip-core = "0.3"
triple_accel = "0.4"
rayon = "1.10"
rustc-hash = "2"
crossbeam-channel = "0.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-htslib = { version = "0.49", default-features = false, features = ["bzip2", "lzma", "libdeflate"] }
hdf5 = "0.8.1"
hdf5-sys = { version = "0.8.1", features = ["static", "zlib"] }
rand = "0.8"
rand_chacha = "0.3"
statrs = "0.18"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

criterion = "0.5"

[[bench]]
name = "pipeline_hot_paths"
harness = false

[profile.profiling]
# Same codegen as release (full optimizations), plus debug symbols so a
# sampling profiler (perf/samply) or gdb can resolve real function/line names.
# Kept as a separate profile so normal `--release` builds (what gets
# installed) stay lean. Build with `cargo build --profile profiling`. See
# PROFILING.md.
inherits = "release"
debug = true
strip = false
