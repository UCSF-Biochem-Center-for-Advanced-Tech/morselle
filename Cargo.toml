[package]
name = "morselle"
version = "0.8.2"
edition = "2021"
description = "MORSELLE: MOlecular Read Structure, Extraction, Labeling & Enumeration -- raw Roche SBX and Illumina reads to 10x-style FASTQs and expression matrices"

[lib]
name = "morselle"
path = "src/lib.rs"

[[bin]]
name = "morselle-extract"
path = "src/main.rs"

[[bin]]
name = "morselle-annotate"
path = "src/bin/morselle-annotate.rs"

[[bin]]
name = "morselle-molecules"
path = "src/bin/morselle-molecules.rs"

[[bin]]
name = "morselle"
path = "src/bin/morselle.rs"

[[bin]]
name = "morselle-illumina"
path = "src/bin/morselle-illumina.rs"

[[bin]]
name = "morselle-cells"
path = "src/bin/morselle-cells.rs"

[[bin]]
name = "morselle-probe-demux"
path = "src/bin/morselle-probe-demux.rs"

[[bin]]
name = "morselle-guides"
path = "src/bin/morselle-guides.rs"

[[bin]]
name = "morselle-protospacer-call"
path = "src/bin/morselle-protospacer-call.rs"

[[bin]]
name = "morselle-probeset-align"
path = "src/bin/morselle-probeset-align.rs"

[dependencies]
needletail = "0.5"
flate2 = { version = "1.0", features = ["zlib"] }
rapidgzip-core = "0.3"
triple_accel = "0.4"
rayon = "1.10"
rustc-hash = "2"
crossbeam-channel = "0.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-htslib = { version = "0.49", default-features = false, features = ["bzip2", "lzma", "libdeflate"] }
hdf5 = "0.8.1"
hdf5-sys = { version = "0.8.1", features = ["static", "zlib"] }
rand = "0.8"
rand_chacha = "0.3"
statrs = "0.18"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

criterion = "0.5"

[[bench]]
name = "pipeline_hot_paths"
harness = false

[profile.profiling]
# Same codegen as release (full optimizations), plus debug symbols so a
# sampling profiler (perf/samply) or gdb can resolve real function/line names.
# Kept as a separate profile so normal `--release` builds (what gets
# installed) stay lean. Build with `cargo build --profile profiling`. See
# docs/PROFILING.md.
inherits = "release"
debug = true
strip = false
