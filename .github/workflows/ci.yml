name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python reporting and comparison dependencies
        run: python3 -m pip install numpy python-pptx
      - name: Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck cmake libhdf5-dev
      - name: macOS tools
        if: runner.os == 'macOS'
        run: |
          brew install shellcheck cmake hdf5
          echo "HDF5_DIR=$(brew --prefix hdf5)" >> "$GITHUB_ENV"
      # The same single gate used locally; see scripts/check.sh for what
      # each step guards against.
      - name: scripts/check.sh
        run: scripts/check.sh
