name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python comparison dependencies
        run: python3 -m pip install numpy
      - name: Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck cmake libhdf5-dev
      - name: macOS tools
        if: runner.os == 'macOS'
        # No Homebrew hdf5: hdf5-sys's `static` feature builds HDF5 from
        # bundled source, and hdf5-sys 0.8.1 cannot parse Homebrew's 2.x
        # version string ("Invalid H5_VERSION: 2.2.0").
        run: brew install shellcheck cmake
      # The same single gate used locally; see scripts/check.sh for what
      # each step guards against.
      - name: scripts/check.sh
        run: scripts/check.sh
