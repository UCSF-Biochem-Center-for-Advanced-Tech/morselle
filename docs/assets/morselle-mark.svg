<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img">
  <title>MORSELLE</title>
  <desc>MOlecular Read Structure, Extraction, Labeling &amp; Enumeration. Mark: three offset sequencing reads, each split into cell barcode (teal), UMI (amber), poly(dT) (grey) and cDNA (indigo).</desc>
  <style>
    .cb{fill:#0F9D8A} .um{fill:#F2A93B} .pt{fill:#8A94A6} .cd{fill:#3B5BDB}
    @media (prefers-color-scheme: dark) {
      .cb{fill:#20B8A2} .um{fill:#F5B551} .pt{fill:#9AA4B6} .cd{fill:#5C7CFA}
    }
  </style>
  <g transform="translate(5.5,22)">
    <rect class="cb" x="0" y="0" width="16" height="14" rx="3"/>
    <rect class="um" x="19" y="0" width="12" height="14" rx="3"/>
    <rect class="pt" x="34" y="0" width="8" height="14" rx="3"/>
    <rect class="cd" x="45" y="0" width="44" height="14" rx="3"/>
    <rect class="cb" x="12" y="21" width="16" height="14" rx="3"/>
    <rect class="um" x="31" y="21" width="12" height="14" rx="3"/>
    <rect class="pt" x="46" y="21" width="8" height="14" rx="3"/>
    <rect class="cd" x="57" y="21" width="32" height="14" rx="3"/>
    <rect class="cb" x="5" y="42" width="16" height="14" rx="3"/>
    <rect class="um" x="24" y="42" width="12" height="14" rx="3"/>
    <rect class="pt" x="39" y="42" width="8" height="14" rx="3"/>
    <rect class="cd" x="50" y="42" width="22" height="14" rx="3"/>
  </g>
</svg>
